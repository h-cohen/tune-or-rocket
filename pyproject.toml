[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tor"
version = "0.1.0"
description = "tune-or-rocket research harness"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["tor", "tor.data", "tor.models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: needs network access (dataset/metadata downloads)",
  "slow: slow contract tests (CPU model builds)",
]
